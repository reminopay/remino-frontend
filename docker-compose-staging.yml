services:
  app:
    container_name: app
    hostname: app
    image: hub.hamdocker.ir/library/node:18-alpine
    expose:
      - "3000"
    restart: always
    environment:
      - NEXT_PUBLIC_CURRENT_VERSION=0.1.3
    networks:
      - app
      - web_net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web_net"

      # HTTP -> HTTPS
      - "traefik.http.routers.nextjs-http.entrypoints=http"
      - "traefik.http.routers.nextjs-http.rule=Host(`${APP_SUB}.${DOMAIN_ADDRESS}`)"
      - "traefik.http.routers.nextjs-http.middlewares=nextjs-redirect"

      - "traefik.http.middlewares.nextjs-redirect.redirectscheme.scheme=https"

      # HTTPS
      - "traefik.http.routers.nextjs-https.entrypoints=https"
      - "traefik.http.routers.nextjs-https.rule=Host(`${APP_SUB}.${DOMAIN_ADDRESS}`)"
      - "traefik.http.routers.nextjs-https.tls=true"
      - "traefik.http.routers.nextjs-https.tls.certresolver=mycert"

      # Backend
      - "traefik.http.routers.nextjs-https.service=nextjs-service"
      - "traefik.http.services.nextjs-service.loadbalancer.server.port=3000"

networks:
  app:
    name: app

  web_net:
    name: web_net
    external: true
